<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8FAFC" />
    <meta name="description" content="Signal 用户反馈与技术工单工作台，连接用户声音、资料依据、人工审核与交付进展。" />
    <title>Signal · 用户反馈与技术工单工作台</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #F8FAFC;
        --surface: #FFFFFF;
        --surface-muted: #F1F5F9;
        --ink: #0F172A;
        --ink-secondary: #334155;
        --ink-muted: #475569;
        --ink-faint: #64748B;
        --line: #E2E8F0;
        --line-strong: #CBD5E1;
        --accent: #2563EB;
        --accent-hover: #1D4ED8;
        --accent-soft: #EFF6FF;
        --accent-line: #BFDBFE;
        --primary-hover: #1E293B;
        --danger: #DC2626;
        --danger-soft: #FEF2F2;
        --danger-line: #FECACA;
        --success: #16A34A;
        --success-soft: #F0FDF4;
        --success-line: #BBF7D0;
        --radius: 12px;
        --control-radius: 8px;
        --card-shadow: 0 1px 3px rgba(15, 23, 42, 0.04), 0 1px 2px rgba(15, 23, 42, 0.02);
        --focus-ring: 0 0 0 3px rgba(37, 99, 235, 0.12);
        background: var(--canvas);
      }

      body {
        margin: 0;
        background: #F8FAFC;
        color: #0F172A;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        font-variant-numeric: tabular-nums;
        -webkit-font-smoothing: antialiased;
      }

      :focus-visible {
        outline: 2px solid #2563EB;
        outline-offset: 3px;
      }

      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      ::-webkit-scrollbar-thumb {
        border-radius: 3px;
        background: #CBD5E1;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
