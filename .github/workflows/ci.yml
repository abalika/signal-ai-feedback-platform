name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Lint frontend
        working-directory: app
        run: npm run lint

      - name: Build frontend
        working-directory: app
        run: npm run build

      - name: Test frontend requests
        working-directory: app
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements-lock.txt

      - name: Install backend dependencies
        run: python -m pip install -r server/requirements-lock.txt

      - name: Test backend
        run: python -m pytest server/tests -q

      - name: Check publication privacy
        run: python scripts/check_publication.py

      - name: Offline workflow and retrieval regression
        run: python scripts/evaluate.py --output work/ci-eval

      - name: HTTP delivery smoke
        run: python scripts/smoke.py
